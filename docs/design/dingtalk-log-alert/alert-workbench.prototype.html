    @media(max-width:760px){.prototype-top{padding:15px 16px}.brand h1{font-size:16px}.brand p{font-size:10px}.brand-mark{width:31px;height:31px;border-radius:9px}.prototype-tools .demo-badge,.prototype-tools .recovery-label{display:none}.prototype-tools{font-size:10px;gap:7px}.stage{margin:0 12px}.desktop-shell,.full-shell{height:calc(100dvh - 162px);min-height:540px;border-radius:12px}.app-rail{display:none}.desktop-shell.has-panel .chat-pane{display:none}.h5-pane{width:100%;min-width:0;max-width:none;border-left:0}.h5-head{padding-top:17px}.full-h5 .h5-head{padding:18px 17px 0}.full-h5 .h5-list{padding:16px}.full-h5 .alert-grid{grid-template-columns:1fr}.full-nav{padding:12px 16px}.full-nav .nav-right>span{display:none}.full-h5 .h5-title{font-size:21px}.demo-bottom{margin:11px 16px 66px;font-size:9px;gap:10px}.demo-bottom span:first-child{max-width:65%}.variant-switcher{bottom:12px}.variant-switcher button{padding:10px 13px;font-size:10px}.phone-notes{display:none}.phone-scene{min-height:0;padding:0 0 60px}.phone{max-height:none;height:calc(100dvh - 158px);min-height:585px;width:min(390px,calc(100vw - 26px));border-width:5px;border-radius:32px}.phone-sheet{top:17%}.phone .h5-source{font-size:9px}.phone .h5-summary{margin-bottom:13px}.phone .card-context .separator{margin:0}.phone .card-context{font-size:10px}.phone .card-facts{gap:4px}.phone .card-facts dt{font-size:8px}.phone .card-facts dd{font-size:10px}.toast{font-size:11px;top:12px}.history-dialog{max-height:85dvh}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

    /* 卡片内容按官方模板排列；群聊和 H5 共用同一渲染，不添加装饰图表。 */
    .alert-card{max-width:460px;width:100%;margin:0 auto;border-radius:8px;box-shadow:none;padding-bottom:16px}.card-head,.phone .card-head{padding:13px 16px 14px}.card-kicker,.phone .card-kicker{display:block;font-size:12px;line-height:18px;font-weight:600;color:#fff}.alert-card .card-head h3{font-size:19px;line-height:25px;margin-top:5px;letter-spacing:0}.card-body,.phone .card-body{padding:12px 16px 0}.card-context,.phone .card-context{display:block;font-size:12px;line-height:19px;color:#778291;margin:0}.evidence{margin-top:12px;padding:10px 12px;border-radius:8px;background:#f3f6fa;color:#778291;font-size:11px;line-height:17px}.occurrence{font-size:12px;line-height:18px;color:#202d3d}.event-times{font-size:11px;line-height:17px;color:#778291;margin-top:8px}.trace-copy{display:block;text-align:left;background:none;padding:0;margin-top:10px;color:#5b7fa6;font-size:11px;line-height:17px;overflow-wrap:anywhere;word-break:break-all}.log-excerpt{margin-top:5px;font-size:11px;line-height:17px;overflow-wrap:anywhere}.metric-evidence{display:block;background:#f5f7fa}.metric-value{font-size:28px;line-height:35px;letter-spacing:0;font-weight:700;color:#f2510c}.metric-rule{text-align:left;font-size:12px;line-height:19px;margin-top:3px;color:#778291}.metric-evidence .event-times{font-size:12px;line-height:19px;margin-top:6px}.metric-dimensions{font-size:12px;line-height:19px;color:#778291;margin-top:10px;overflow-wrap:anywhere}.monitor-hint{font-size:13px;line-height:20px;margin-top:10px}.handling-progress{margin-top:12px}.handling-progress h4{font-size:15px;line-height:21px;font-weight:700;margin:0}.handling-progress p{font-size:13px;line-height:19px;margin-top:6px;overflow-wrap:anywhere}.notes{margin-top:12px;padding:0}.notes-title{font-size:13px;line-height:19px;color:#202d3d;font-weight:700;margin:0}.note{padding:0;margin-top:12px;font-size:13px;line-height:19px;color:#202d3d}.note-by{display:block;font-size:11px;line-height:17px;color:#778291;margin:0 0 3px}.log-card .note:first-of-type p{font-weight:600}.no-notes{font-size:12px;line-height:18px;color:#778291;padding:0;margin-top:8px}.history-link{font-size:12px;line-height:18px;color:#1677ff;display:block;background:none;padding:0;margin-top:12px;text-align:left}.metric-notes{padding:10px 12px;border-radius:8px;background:#f5f7fa}.metric-notes .note{margin-top:8px;font-weight:400}.metric-notes .note-by{margin:3px 0 0}.card-footer,.phone .card-footer{padding:0 16px;margin-top:12px;gap:8px}.card-footer .button{font-size:14px;line-height:20px;font-weight:400;min-height:36px;border-radius:20px;padding:8px 12px}.card-footer .primary{color:#1677ff;background:#f3f4f6;border:0}.card-footer .secondary{background:#f3f4f6;color:#202d3d;border:0}.alert-number{font-size:11px;line-height:17px;color:#778291;margin:8px 16px -8px}.metric-card .editor-actions{flex-direction:column-reverse}.metric-card .editor{margin-bottom:0}.phone .alert-card{max-width:460px}.phone .card-footer .button{min-height:40px}.full-h5 .alert-card{max-width:460px}.full-h5 .alert-grid{column-gap:22px}
    /* 钉钉已提供侧栏容器，嵌入时直接展示工作台，避免重复导航和关闭按钮。 */

    .embedded .stage{margin:0;max-width:none;height:calc(100dvh - 28px)}

    .embedded .demo-bottom span:first-child{max-width:none}

<body>
  <header class="prototype-top">
    <div class="brand"><div class="brand-mark" aria-hidden="true">↗</div><div><h1>告警卡片 × H5</h1><p>同一张卡片，贯穿发现、跟进与完成</p></div></div>
    <div class="prototype-tools"><span class="demo-badge">本地交互原型</span><button class="text-button" data-action="recover" title="模拟一次监控恢复事件"><span class="recovery-label">演示：</span>指标恢复</button><button class="text-button" data-action="reset">重置预览</button></div>
  </header>
  <main id="app" class="stage"></main>
  <div class="demo-bottom" id="demo-status"></div>
  <nav class="variant-switcher" aria-label="预览模式" id="variants"></nav>
  <div class="toast" role="status" aria-live="polite" id="toast"></div>
  <div id="modal"></div>
  <script>
    'use strict';
    const icons = {
      log:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/>',
      metric:'<path d="M3 18h18M4 14l4-6 5 4 6-9"/><path d="M15 3h4v4"/>',
      chat:'<path d="M21 11a8 8 0 0 1-8 8H8l-5 3 1-6a8 8 0 1 1 17-5Z"/><path d="M8 10h8M8 14h5"/>',
      grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
      bell:'<path d="M18 8a6 6 0 0 0-12 0c0 8-3 8-3 10h18c0-2-3-2-3-10M9 21h6"/>',
      more:'<circle cx="4" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="20" cy="12" r="1"/>',
      search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',
      close:'<path d="m6 6 12 12M6 18 18 6"/>',
      arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',
      back:'<path d="M20 12H5m6-6-6 6 6 6"/>',
      pin:'<path d="m8 3 8 0-1 6 4 4v2H5v-2l4-4-1-6ZM12 15v7"/>',
      box:'<path d="m12 3 9 5v9l-9 5-9-5V8l9-5Z"/><path d="m3 8 9 5 9-5M12 13v9"/>',
      check:'<path d="m5 12 4 4L19 6"/>',
      circlecheck:'<circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/>',
      note:'<path d="M12 4H4v16h16v-8M10 14l1-4 8-8 3 3-8 8-4 1Z"/>',
      clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',
      robot:'<rect x="4" y="6" width="16" height="14" rx="4"/><path d="M12 6V2M1 11v5M23 11v5M8 11v2M16 11v2M9 17h6"/>',
      sparkle:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>',
      link:'<path d="m10 13 4-4M8 16l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0M16 8l2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(0 -1) scale(.9)"/>',
      desktop:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 22h8M12 17v5M14 3v14"/>',
      phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 5h4M10 19h4"/>',
      shield:'<path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6l9-4Z"/><path d="m8 12 3 3 5-6"/>',
      smile:'<circle cx="12" cy="12" r="9"/><path d="M8 8v2M16 8v2M7 14c2 4 8 4 10 0"/>',
      folder:'<path d="M3 5h7l2 3h9v13H3V5Z"/>',
      battery:'<rect x="2" y="6" width="18" height="12" rx="2"/><path d="M23 10v4M5 9h12v6H5Z"/>'
    };
    const icon = name => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || icons.log}</svg>`;
    const escapeHtml = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const initialAlerts = [
      {id:'log-1',type:'log',state:'pending',title:'设备消息解析异常',project:'智享云 V3',service:'micro-forward',first:'10:02:18',latest:'10:18:42',count:18,duration:'16 分钟',code:'PARSE_LENGTH_ERROR',evidence:'设备上报数据长度与协议预期不一致，消息解析失败。',location:'xpond/worker.go:46',trace:'a73f90d2c8b14e6f9a213805bc62d490',notes:[]},
      {id:'metric-1',type:'metric',state:'pending',title:'CPU 使用率过高',project:'prod-demo',service:'app-node-07',first:'10:02:00',latest:'10:20:00',duration:'18 分钟',value:'92.6',unit:'%',threshold:'≥ 85%',window:'连续 5 分钟',metric:'cpu_usage_percent',notes:[]},
      {id:'log-2',type:'log',state:'processing',title:'订单回调请求超时',project:'交易平台',service:'biz-order',first:'09:42:06',latest:'10:19:08',count:32,duration:'38 分钟',code:'CALLBACK_TIMEOUT',evidence:'回调超过 3 秒未响应，已进入自动重试队列。',location:'callback/client.go:128',trace:'b8e14af2937c46d0ac359206fba18e72',ai:'AI 已定位：下游连接池等待超时，修复建议已生成。',notes:[{text:'已调整连接池配置，正在验证回调结果。',author:'刘强',time:'10:12',kind:'note'}]},
      {id:'metric-2',type:'metric',state:'processing',title:'容器内存使用率过高',project:'设备服务',service:'device-worker-03',first:'09:56:00',latest:'10:20:00',duration:'24 分钟',value:'88.4',unit:'%',threshold:'> 85%',window:'持续 3 分钟',metric:'container_memory_usage',notes:[{text:'已定位缓存增长，观察内存回收情况。',author:'王晨',time:'10:09',kind:'note'}]},
      {id:'log-3',type:'log',state:'pending',title:'第三方接口返回异常',project:'开放平台',service:'open-api',first:'10:14:05',latest:'10:19:30',count:7,duration:'6 分钟',code:'UPSTREAM_UNAVAILABLE',evidence:'上游服务返回 503，请求未获得有效响应。',location:'gateway/upstream.go:87',trace:'d4391ef508bc46a382170e5af694d2b0',notes:[]},
      {id:'log-4',type:'log',state:'pending',title:'设备状态更新失败',project:'智享云 V3',service:'device-state',first:'10:16:33',latest:'10:19:52',count:5,duration:'4 分钟',code:'STATE_WRITE_CONFLICT',evidence:'设备状态版本冲突，本次更新未写入。',location:'state/repository.go:63',trace:'e318a0b64fc9427d85c09f2361ab74d2',notes:[]}
    ];
    const viewOptions = [{id:'desktop',label:'群聊 + H5',icon:'desktop'},{id:'workspace',label:'H5 完整页',icon:'grid'},{id:'mobile',label:'手机半浮层',icon:'phone'}];
    const params = new URLSearchParams(location.search);
    const embedded = params.get('embed') === '1';
    document.body.classList.toggle('embedded', embedded);
    let variant = embedded ? 'workspace' : viewOptions.some(v => v.id === params.get('variant')) ? params.get('variant') : 'desktop';
    let alerts, messages, editor, filter, panelOpen, completedFocus, noticeCount, sequence, historyId, toastTimer;
    function resetData(){alerts=structuredClone(initialAlerts);messages=[{id:'metric-1',time:'10:08',event:''},{id:'log-1',time:'10:18',event:''}];editor=null;filter='all';panelOpen=true;completedFocus=null;noticeCount=0;sequence=0;historyId=null;}
    const terminal = a => a.state === 'closed' || a.state === 'resolved';
    const status = a => ({pending:'待处理',processing:'处理中',closed:'已处理',resolved:'已恢复'}[a.state]);
    const typeName = a => a.type === 'log' ? '日志告警' : '指标告警';
    const byId = id => alerts.find(a => a.id === id);
    const activeAlerts = () => alerts.filter(a => !terminal(a));
    const countType = type => activeAlerts().filter(a => !type || a.type === type).length;
    const countState = (state,type) => activeAlerts().filter(a => a.state === state && (!type || a.type === type)).length;
    const groupName = '告警平台卡片交互测试';
    const attr = escapeHtml;

    function ceiling(){if(countType()===0)return '';return `<div class="ceiling-wrap"><section class="ceiling" aria-label="吊顶告警统计"><div class="ceiling-title"><strong>${icon('pin')}本群未完成告警</strong><span>随处理进度更新</span></div><div class="ceiling-stats">${['log','metric'].map(type=>`<div class="ceiling-stat ${type}"><div><h3>${type==='log'?'日志告警':'指标告警'}</h3><p><i class="dot red"></i>待处理 ${countState('pending',type)}&ensp;<i class="dot orange"></i>处理中 ${countState('processing',type)}</p></div><b class="num" data-count="${type}">${countType(type)}</b></div>`).join('')}</div><button class="ceiling-link" data-action="open-h5">查看未完成（${countType()}）${icon('arrow')}</button></section></div>`;}
    function noteList(a){const notes=a.notes.filter(n=>n.kind!=='complete');if(a.type==='metric'&&!notes.length)return '';return `<section class="notes ${a.type==='metric'?'metric-notes':''}"><h4 class="notes-title">${a.type==='metric'?'备注':'人工备注'} · ${notes.length} 条</h4>${notes.length?notes.slice(-3).reverse().map((n,i)=>`<div class="note">${a.type==='log'?`<div class="note-by">${i===0?'最新 · ':''}${escapeHtml(n.author)} · 10-05 ${n.time}</div><p>${escapeHtml(n.text)}</p>`:`<p>${escapeHtml(n.text)}</p><div class="note-by">${escapeHtml(n.author)} · 10-05 ${n.time}</div>`}</div>`).join(''):'<p class="no-notes">暂无备注，可按需补充处理进展。</p>'}<button class="history-link" data-action="history" data-id="${a.id}">查看完整处理记录 ↗</button></section>`;}
    function evidence(a){if(a.type==='log')return `<div class="evidence log-evidence"><p class="occurrence">累计 ${a.count} 次 · 持续 ${a.duration}</p><p class="event-times">首次 10-05 ${a.first.slice(0,5)} · 最近 ${a.latest.slice(0,5)}</p><button class="trace-copy" data-action="copy-trace" data-id="${a.id}" title="点击复制完整 Trace ID">${a.trace}</button><p class="log-excerpt">${a.code}: ${a.evidence}</p></div>`;return `<div class="evidence metric-evidence"><div class="metric-value">${a.value}${a.unit}</div><p class="metric-rule">阈值 ${a.threshold} · ${a.window}</p><p class="event-times">首次 ${a.first.slice(0,5)} · ${terminal(a)?'恢复':'最近接收'} ${a.endedAt || a.latest.slice(0,5)}<br>持续 ${a.duration}</p></div><p class="metric-dimensions">${a.metric} · ${a.type==='metric'&&a.id==='metric-1'?'cpu=all':'container=worker'}</p><p class="monitor-hint">${terminal(a)?'监控已确认恢复，本轮告警自动结束。':'指标仍超阈值，等待监控恢复。'}</p>`;}
    function progress(a){if(a.type!=='log')return '';const completed=a.notes.findLast(n=>n.kind==='complete');let title,body;if(terminal(a)){title='人工处理完成';body=completed?`处理结果：${completed.text}；处理人：${completed.author} · 10-05 ${completed.time}`:'本轮已处理。';}else if(a.ai){title='AI 已完成定位';body=a.ai;}else if(a.state==='processing'){title='人工正在跟进';body='处理进展见下方备注。';}else{title='等待 AI 开始处理';body='开始后自动更新此卡片，同类告警持续累计。';}return `<section class="handling-progress"><h4>${title}</h4><p>${escapeHtml(body)}</p></section>`;}
    function card(a,context){const isEditing=editor&&editor.id===a.id&&editor.context===context;return `<article class="alert-card ${a.type}-card ${a.state}" data-alert-id="${a.id}" data-context="${context}" aria-label="${typeName(a)} ${a.title} ${status(a)}"><header class="card-head"><div class="card-kicker">${typeName(a)} · ${status(a)}</div><h3>${a.title}</h3></header><div class="card-body"><p class="card-context">${a.project}${a.type==='log'?' / ':' · '}${a.service}</p>${evidence(a)}${progress(a)}${noteList(a)}</div>${terminal(a)?'':isEditing?editorForm(a):`<div class="card-footer"><button class="button primary" data-action="edit" data-mode="note" data-id="${a.id}" data-context="${context}">添加备注</button>${a.type==='log'?`<button class="button secondary" data-action="edit" data-mode="complete" data-id="${a.id}" data-context="${context}">标记已处理</button>`:''}</div>`}${a.type==='log'?`<p class="alert-number">告警编号 LOG-20261005-00${a.id.split('-')[1]}</p>`:''}</article>`;}
    function editorForm(a){const done=editor.mode==='complete';return `<form class="editor" data-id="${a.id}"><label for="note-input">${done?'处理完成，补充一句结果':'添加处理备注'}</label><textarea id="note-input" name="note" maxlength="500" placeholder="${done?'例如：已修复协议解析并验证，消息恢复正常。':'例如：已定位问题，正在修复。'}" aria-describedby="editor-hint">${escapeHtml(editor.draft)}</textarea><p class="editor-hint ${editor.error?'error':''}" id="editor-hint">${editor.error || (done?'提交后本轮结束，历史记录保留且不可再添加备注。':editor.context==='h5'?'提交后同步到群；首条备注会将状态变为处理中。':'提交后更新本卡片；首条备注会将状态变为处理中。')}</p><div class="editor-actions"><button type="button" class="button secondary" data-action="cancel">取消</button><button type="submit" class="button ${done?'success':'solid'}">${done?'提交并完成':'提交备注'}</button></div></form>`;}
    function chat(){return `<section class="chat-pane" aria-label="钉钉群聊预览"><header class="chat-header"><div><div class="chat-title">${groupName}<small>内部群</small></div><div class="chat-subtitle">1 人 · 告警通知与协作</div></div><div class="header-actions" aria-hidden="true">${icon('search')}${icon('more')}</div></header>${ceiling()}<div class="chat-scroll" data-scroll="chat"><div class="chat-date">今天 · 10 月 05 日</div>${messages.map((m,i)=>`<div class="message" data-message-index="${i}"><div class="bot-avatar">${icon('robot')}</div><div class="message-content"><div class="message-meta"><strong>告警助手</strong><span>${m.time}</span>${m.event?`<span class="message-event">${icon('check')} ${m.event}</span>`:''}</div>${card(byId(m.id),'chat-'+i)}</div></div>`).join('')}</div><div class="chat-composer"><div class="composer-tools" aria-hidden="true">${icon('smile')}${icon('folder')}${icon('note')}</div><div class="composer-placeholder"><span>群消息预览</span><span>Enter 发送</span></div></div></section>`;}
    function h5Head(){return `<header class="h5-head"><div class="eyebrow">${icon('shield')}AlertOps · 告警处理</div><h2 class="h5-title">本群未完成告警 <span class="count-pill" data-count="total">${countType()}</span></h2><p class="h5-source">${groupName}</p><div class="h5-summary"><span><i class="dot red"></i>待处理 <b>${countState('pending')}</b></span><span><i class="dot orange"></i>处理中 <b>${countState('processing')}</b></span></div><nav class="h5-tabs" aria-label="告警类型">${[['all','全部',countType()],['log','日志告警',countType('log')],['metric','指标告警',countType('metric')]].map(([id,label,n])=>`<button class="tab ${filter===id?'active':''}" aria-pressed="${filter===id}" data-action="filter" data-filter="${id}">${label}<small>${n}</small></button>`).join('')}</nav></header>`;}
    function h5List(){const focused=completedFocus&&byId(completedFocus);const items=activeAlerts().filter(a=>filter==='all'||a.type===filter);return `<div class="h5-list" data-scroll="h5">${focused?`<button class="back-button" data-action="back-list">${icon('back')}返回未完成列表</button><div class="completion-banner">${icon('circlecheck')}<div>本轮${focused.state==='closed'?'已处理':'已恢复'}，已从未完成列表移除。<p>你仍可查看本次结果与历史记录。</p></div></div><div class="focused-card">${card(focused,'h5')}</div>`:`<div class="list-caption"><span>待处理优先 · 共 ${items.length} 项</span><span>${icon('clock')}最近更新 10:${String(20+sequence).padStart(2,'0')}</span></div>${items.length?`<div class="alert-grid">${items.slice().sort((a,b)=>(a.state==='pending'?0:1)-(b.state==='pending'?0:1)).map(a=>card(a,'h5')).join('')}</div>`:`<div class="empty-state">${icon('circlecheck')}<h3>${filter==='all'?'当前没有未完成告警':`暂无未完成的${filter==='log'?'日志':'指标'}告警`}</h3><p>新的告警出现后，会在这里展示。</p></div>`}`}</div>`;}
    function h5Chrome(mobile=false){return `<div class="h5-chrome"><span>${icon('link')}告警处理工作台</span><button class="icon-button" data-action="close-h5" aria-label="关闭 H5">${icon('close')}</button></div>`;}
    function desktop(){return `<div class="desktop-shell ${panelOpen?'has-panel':''}"><aside class="app-rail" aria-hidden="true"><div class="rail-brand">${icon('sparkle')}</div><div class="rail-button active">${icon('chat')}</div><div class="rail-button">${icon('grid')}</div><div class="rail-button">${icon('bell')}</div><div class="rail-bottom avatar">刘</div></aside>${chat()}${panelOpen?`<section class="h5-pane" aria-label="H5 侧栏">${h5Chrome()}${h5Head()}${h5List()}</section>`:''}</div>`;}
    function workspace(){return `<div class="full-shell"><div class="full-nav"><strong>${icon('shield')} AI AlertOps</strong><div class="nav-right"><span>群内告警工作台</span><div class="avatar">刘</div>刘强</div></div><section class="full-h5" aria-label="H5 完整页">${h5Head()}${h5List()}</section></div>`;}
    function mobile(){return `<div class="phone-scene"><aside class="phone-notes"><div class="eyebrow">MOBILE PREVIEW</div><h2>从群里打开，<br>在卡片上处理。</h2><p>熟悉的信息结构，适合单手操作。<br>关闭页面，即可回到群聊。</p><div class="phone-note"><span>01</span><div><h3>吊顶看统计</h3><p>日志、指标分开计数，<br>只保留还需要关注的告警。</p></div></div><div class="phone-note"><span>02</span><div><h3>半浮层处理</h3><p>添加备注即开始跟进。<br>日志可完成，指标等待监控恢复。</p></div></div><div class="phone-note"><span>03</span><div><h3>有变更，群里有新消息</h3><p>只查看不发送；成功提交后，<br>最新卡片重新出现在群里。</p></div></div></aside><div class="phone"><div class="phone-status"><span>10:20</span><div class="island"></div><span>5G ${icon('battery')}</span></div>${chat()}${panelOpen?`<div class="phone-backdrop"></div><section class="phone-sheet" aria-label="H5 手机半浮层"><div class="sheet-handle"></div>${h5Chrome(true)}${h5Head()}${h5List()}</section>`:''}<div class="phone-home"></div></div></div>`;}
    function render(options={}){const scrolls=Object.fromEntries([...document.querySelectorAll('[data-scroll]')].map(el=>[el.dataset.scroll,el.scrollTop]));document.getElementById('app').innerHTML=variant==='desktop'?desktop():variant==='workspace'?workspace():mobile();document.getElementById('variants').innerHTML=viewOptions.map(v=>`<button data-action="variant" data-variant="${v.id}" class="${variant===v.id?'active':''}" aria-pressed="${variant===v.id}">${icon(v.icon)}${v.label}</button>`).join('');document.getElementById('demo-status').innerHTML=`<span>${icon('shield')}模拟数据 · 不发送真实消息 · 刷新后重置</span><span class="notification-count" data-notifications="${noticeCount}">H5 新增群消息：${noticeCount} 条</span>`;document.querySelectorAll('[data-scroll]').forEach(el=>{if(options.chatBottom&&el.dataset.scroll==='chat'){const last=el.querySelector('.message:last-child');el.scrollTop=last?last.getBoundingClientRect().top-el.getBoundingClientRect().top+el.scrollTop-15:0;}else{el.scrollTop=options.top&&el.dataset.scroll==='h5'?0:scrolls[el.dataset.scroll]||0;}});if(options.focusInput){const input=document.getElementById('note-input');if(input){input.focus({preventScroll:true});input.scrollIntoView({block:'nearest',behavior:'instant'});}}renderModal();}
    function toast(message){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),3000);}
    function renderModal(){const el=document.getElementById('modal');if(!historyId){el.innerHTML='';return;}const a=byId(historyId);const events=[...(a.state==='resolved'?[{kind:'restore',text:`监控确认恢复，指标值 ${a.value}${a.unit}。`,author:'监控系统',time:a.endedAt}]:[]),...a.notes.slice().reverse(),{kind:'start',text:a.type==='log'?a.evidence:`${a.title}，触发阈值 ${a.threshold}，${a.window}。`,author:'告警助手',time:a.first}];el.innerHTML=`<div class="modal-overlay"><section class="history-dialog" role="dialog" aria-modal="true" aria-labelledby="history-title"><header class="dialog-head"><div><h2 id="history-title">处理记录</h2><p>${a.title} · ${status(a)}</p></div><button class="icon-button" data-action="close-history" aria-label="关闭处理记录">${icon('close')}</button></header><div class="history-list">${events.map(n=>`<div class="history-event"><h3>${{note:'添加备注',complete:'标记已处理',restore:'指标已恢复',start:'首次告警'}[n.kind]}</h3><p>${escapeHtml(n.text)}</p><small>${escapeHtml(n.author)} · ${n.time}</small></div>`).join('')}</div></section></div>`;}
    function switchVariant(next){variant=next;const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render({chatBottom:true});}
    function submit(){if(!editor)return;const current=editor;const a=byId(current.id);if(terminal(a)){editor=null;completedFocus=a.id;render();toast('本轮已结束，不能再添加备注。');return;}const draft=current.draft.trim();if(!draft){editor.error=current.mode==='complete'?'请填写一句处理结果。':'请填写备注内容。';render({focusInput:true});return;}sequence++;const time=`10:${String(20+sequence).padStart(2,'0')}`;a.notes.push({text:draft,author:'刘强',time,kind:current.mode==='complete'?'complete':'note'});a.state=current.mode==='complete'?'closed':'processing';if(current.mode==='complete'){a.endedAt=time;if(current.context==='h5')completedFocus=a.id;}const fromH5=current.context==='h5';editor=null;if(fromH5){messages.push({id:a.id,time,event:current.mode==='complete'?'H5 · 已处理':'H5 · 新增备注'});noticeCount++;}render({chatBottom:fromH5,top:current.mode==='complete'});if(fromH5){const updated=document.querySelector(`[data-context="h5"][data-alert-id="${a.id}"]`);if(updated)updated.scrollIntoView({block:'nearest',behavior:'instant'});}toast(fromH5?'保存成功，最新卡片已同步到群。':'保存成功，群卡片已更新。');}
    document.addEventListener('input',event=>{if(event.target.id==='note-input'&&editor){editor.draft=event.target.value;editor.error='';const hint=document.getElementById('editor-hint');if(hint&&hint.classList.contains('error')){hint.classList.remove('error');hint.textContent='提交后保存本次记录。';}}});
    document.addEventListener('submit',event=>{if(event.target.matches('.editor')){event.preventDefault();submit();}});
    document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
      if(action==='edit'){const a=byId(button.dataset.id);if(terminal(a)){toast('本轮已结束，记录只读。');return;}editor={id:a.id,context:button.dataset.context,mode:button.dataset.mode,draft:'',error:''};render({focusInput:true});}
      else if(action==='copy-trace'){navigator.clipboard.writeText(byId(button.dataset.id).trace).then(()=>toast('Trace ID 已复制。')).catch(()=>toast('复制未成功，可选中完整 Trace ID 复制。'));}
      else if(action==='cancel'){editor=null;render();}
      else if(action==='open-h5'){panelOpen=true;completedFocus=null;filter='all';editor=null;render({top:true});}
      else if(action==='close-h5'){panelOpen=false;editor=null;render({chatBottom:true});}
      else if(action==='filter'){filter=button.dataset.filter;editor=null;completedFocus=null;render({top:true});}
      else if(action==='back-list'){completedFocus=null;render({top:true});}
      else if(action==='variant'){switchVariant(button.dataset.variant);}
      else if(action==='reset'){resetData();render({chatBottom:true,top:true});toast('已恢复为最初的 6 项告警。');}
      else if(action==='recover'){const a=alerts.find(a=>a.type==='metric'&&!terminal(a));if(!a){toast('两项指标均已恢复。');return;}sequence++;a.state='resolved';a.value='43.2';a.endedAt='10:32';a.duration=(632-Number(a.first.slice(0,2))*60-Number(a.first.slice(3,5)))+' 分钟';if(editor&&editor.id===a.id)editor=null;completedFocus=a.id;panelOpen=true;render({top:true});toast('模拟监控恢复：统计已减少，原卡已变绿。');}
      else if(action==='history'){historyId=button.dataset.id;renderModal();document.querySelector('[data-action="close-history"]').focus();}
      else if(action==='close-history'){historyId=null;renderModal();}
    });
    document.addEventListener('keydown',event=>{if(historyId){if(event.key==='Escape'){historyId=null;renderModal();}else if(event.key==='Tab'){event.preventDefault();document.querySelector('[data-action="close-history"]').focus();}return;}if(embedded||['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName)||event.target.isContentEditable)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){const index=viewOptions.findIndex(v=>v.id===variant);switchVariant(viewOptions[(index+(event.key==='ArrowRight'?1:2))%3].id);}});
    resetData();render({chatBottom:true});
  </script>
</body>
</html>
